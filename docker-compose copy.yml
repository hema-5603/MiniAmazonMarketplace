version: '3.8'
services:
  user_db:
    image: mysql:8.0
    container_name: mam_user_db
    restart: always
    environment:
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        MYSQL_DATABASE: ${DB_NAME} 
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - user_db_data:/var/lib/mysql
volumes:
  user_db_data: